        if (isFirebaseConnected && dbInstance && window.firebaseModules) {
            try {
                const docRef = window.firebaseModules.doc(dbInstance, 'smart_ledger', 'shared_data');
                await window.firebaseModules.setDoc(docRef, {
                    appData: appData,
                    monthlyDataMap: monthlyDataMap,
                    updatedAt: new Date().toISOString()
                });
            } catch (err) {
                console.error("Firestore 저장 실패:", err);
            }
        }
    }

    function loadFromLocalStorage() {
        try {
            const savedMain = localStorage.getItem(STORAGE_KEY_MAIN);
            const savedMonthly = localStorage.getItem(STORAGE_KEY_MONTHLY);
            if (savedMain) appData = JSON.parse(savedMain);
            else appData = JSON.parse(JSON.stringify(defaultAppData));

            if (savedMonthly) monthlyDataMap = JSON.parse(savedMonthly);
            else monthlyDataMap = JSON.parse(JSON.stringify(defaultMonthlyMap));

            if (!Array.isArray(appData.categories)) {
                appData.categories = [...defaultAppData.categories];
            }
            if (!Array.isArray(appData.fixedCategories)) {
                appData.fixedCategories = [...defaultAppData.fixedCategories];
            }

            if (!Array.isArray(appData.splitRules)) appData.splitRules = [];
            appData.splitRules = appData.splitRules.map(rule => {
                const acc = (appData.accounts || []).find(a => a.id === rule.accountId);
                return {
                    ...rule,
                    displayName: rule.displayName || (acc ? acc.name : (rule.purpose || '통장 표시명')),
                    purpose: rule.purpose || ''
                };
            });
        } catch (e) {
            appData = JSON.parse(JSON.stringify(defaultAppData));
            monthlyDataMap = JSON.parse(JSON.stringify(defaultMonthlyMap));
        }
    }

    function refreshAllUI() {
        loadMonthlyData();
        renderAccountBalances();
        renderAccountSelects();
        calculateMonthlySummary();
        renderCalendar();
        renderVariableExpenses();
        renderInvestments();
        renderAssetChartsAndTables();
        renderSchedules();
        renderSettingsAccounts();
        renderSplitRules();
        renderCategoryManagers();
    }

    function renderCategoryManagers() {
        const renderList = (containerId, listArr, type) => {
            const el = document.getElementById(containerId);
            if (!el) return;
            el.innerHTML = (listArr || []).map((cat, idx) => `
                <div draggable="true" data-cat-type="${type}" data-cat-index="${idx}" class="draggable-cat-item py-3 px-1 flex items-center justify-between text-xs sm:text-sm font-semibold text-slate-800">
                    <div class="flex items-center gap-2.5">
                        <i class="fa-solid fa-grip-lines text-slate-400 text-xs"></i>
                        <span>${cat}</span>
                    </div>
                    <button type="button" onclick="deleteCategoryItem('${type}', ${idx})" aria-label="${cat} 삭제" class="text-rose-500 hover:text-rose-700 p-1 transition">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            `).join('');

            el.querySelectorAll('.draggable-cat-item').forEach((item, idx) => {
                item.ondragstart = (e) => {
                    draggedIndex = idx;
                    draggedCategoryType = type;
                    e.dataTransfer.effectAllowed = 'move';
                    item.classList.add('opacity-50');
                };
                item.ondragend = () => {
                    item.classList.remove('opacity-50');
                    el.querySelectorAll('.draggable-cat-item').forEach(r => r.classList.remove('drag-over'));
                };
                item.ondragover = (e) => {
                    e.preventDefault();
                    if (draggedCategoryType === type) item.classList.add('drag-over');
                };
                item.ondragleave = () => item.classList.remove('drag-over');
                item.ondrop = (e) => {
                    e.preventDefault();
                    item.classList.remove('drag-over');
                    if (draggedCategoryType === type && draggedIndex !== null && draggedIndex !== idx) {
                        const moved = listArr.splice(draggedIndex, 1)[0];
                        listArr.splice(idx, 0, moved);
                        saveDataSync();
                        renderCategoryManagers();
                        renderAccountSelects();
                        renderVariableExpenses();
                        renderSchedules();
                        renderReviewComparisonChart();
                    }
                    draggedIndex = null;
                    draggedCategoryType = null;
                };
            });
        };

        renderList('fixed-category-list', appData.fixedCategories, 'fixed');
        renderList('var-category-list', appData.categories, 'variable');
        populateBulkCategorySelects();
    }

    function populateBulkCategorySelects() {
        const fillSelect = (id, arr) => {
            const sel = document.getElementById(id);
            if (!sel) return;
            const prevVal = sel.value;
            sel.innerHTML = (arr || []).map(c => `<option value="${c}">${c}</option>`).join('');
            if (prevVal && (arr || []).includes(prevVal)) sel.value = prevVal;
        };
        fillSelect('bulk-fixed-from', appData.fixedCategories);
        fillSelect('bulk-fixed-to', appData.fixedCategories);
        fillSelect('bulk-var-from', appData.categories);
        fillSelect('bulk-var-to', appData.categories);
    }

    function addCategoryItem(type) {
        const isFixed = type === 'fixed';
        const inputEl = document.getElementById(isFixed ? 'new-fixed-category-input' : 'new-var-category-input');
        if (!inputEl) return;
        const name = inputEl.value.trim();
        if (!name) return;

        const targetArr = isFixed ? appData.fixedCategories : appData.categories;
        if (targetArr.includes(name)) {
            alert('이미 등록된 카테고리입니다.');
            return;
        }

        targetArr.push(name);
        inputEl.value = '';
        saveDataSync();
        renderCategoryManagers();
        renderAccountSelects();
        renderVariableExpenses();
        renderSchedules();
        renderReviewComparisonChart();
    }

    function deleteCategoryItem(type, index) {
        const isFixed = type === 'fixed';
        const targetArr = isFixed ? appData.fixedCategories : appData.categories;
        if (!Array.isArray(targetArr) || index < 0 || index >= targetArr.length) return;

        targetArr.splice(index, 1);
        saveDataSync();
        renderCategoryManagers();
        renderAccountSelects();
        renderVariableExpenses();
        renderSchedules();
        renderReviewComparisonChart();
    }

    function bulkChangeCategory(type) {
        const isFixed = type === 'fixed';
        const fromVal = document.getElementById(isFixed ? 'bulk-fixed-from' : 'bulk-var-from')?.value;
        const toVal = document.getElementById(isFixed ? 'bulk-fixed-to' : 'bulk-var-to')?.value;
        if (!fromVal || !toVal) return;
        if (fromVal === toVal) {
            alert('원래 카테고리와 변경할 카테고리가 같습니다.');
            return;
        }

        let changedCount = 0;
        if (isFixed) {
            (appData.schedules || []).forEach(sc => {
                if (sc.category === fromVal) {
                    sc.category = toVal;
                    changedCount++;
                }
            });
        } else {
            Object.keys(monthlyDataMap || {}).forEach(mKey => {
                const mObj = monthlyDataMap[mKey];
                if (mObj && Array.isArray(mObj.expenses)) {
                    mObj.expenses.forEach(exp => {
                        if (exp.category === fromVal) {
                            exp.category = toVal;
                            changedCount++;
                        }
                    });
                }
            });
            (appData.expenses || []).forEach(exp => {
                if (exp.category === fromVal) {
                    exp.category = toVal;
                }
            });
        }

        if (changedCount === 0) {
            alert(`"${fromVal}" 카테고리로 지정된 기존 내역이 없습니다.`);
            return;
        }

        saveDataSync();
        renderVariableExpenses();
        renderSchedules();
        renderReviewDashboard();
        alert(`"${fromVal}" → "${toVal}"로 총 ${changedCount}건의 내역이 변경되었습니다.`);
    }

    function updateExpenseCategoryInline(expenseId, newCategory) {
        const exp = (appData.expenses || []).find(e => e.id === expenseId);
        if (exp) exp.category = newCategory;

        const mObj = monthlyDataMap[currentMonth];
        if (mObj && Array.isArray(mObj.expenses)) {
            const mExp = mObj.expenses.find(e => e.id === expenseId);
            if (mExp) mExp.category = newCategory;
        }

        saveDataSync();
        renderReviewComparisonChart();
    }

    function updateScheduleCategoryInline(scheduleId, newCategory) {
        const sc = (appData.schedules || []).find(s => s.id === scheduleId);
        if (sc) sc.category = newCategory;

        saveDataSync();
        renderReviewComparisonChart();
    }

    function makeTableDraggable(tableBodyId, dataArray, renderCallback) {
        const tbody = document.getElementById(tableBodyId);
        if (!tbody) return;

        const rows = tbody.querySelectorAll('tr');
        rows.forEach((row, index) => {
            row.classList.add('draggable-row');
            row.setAttribute('draggable', 'true');
            row.setAttribute('data-index', index);

            row.ondragstart = (e) => {
                draggedIndex = index;
                e.dataTransfer.effectAllowed = 'move';
                row.classList.add('opacity-50');
            };

            row.ondragend = () => {
                row.classList.remove('opacity-50');
                rows.forEach(r => r.classList.remove('drag-over'));
            };

            row.ondragover = (e) => {
                e.preventDefault();
                row.classList.add('drag-over');
            };

            row.ondragleave = () => {
                row.classList.remove('drag-over');
            };

            row.ondrop = (e) => {
                e.preventDefault();
                row.classList.remove('drag-over');
                const targetIndex = parseInt(row.getAttribute('data-index'));
                if (draggedIndex !== null && draggedIndex !== targetIndex) {
                    const movedItem = dataArray.splice(draggedIndex, 1)[0];
                    dataArray.splice(targetIndex, 0, movedItem);
                    saveDataSync();
                    renderCallback();
                }
            };
        });
    }

    async function connectFirebaseWithConfig(configObj) {
        if (!window.firebaseModules) {
            setTimeout(() => connectFirebaseWithConfig(configObj), 500);
            return;
        }
        try {
            const { initializeApp, getApps, deleteApp, getFirestore, doc, onSnapshot, getDoc, setDoc } = window.firebaseModules;
            if (getApps().length > 0) await deleteApp(getApps()[0]);

            firebaseAppInstance = initializeApp(configObj);
            dbInstance = getFirestore(firebaseAppInstance);

            const docRef = doc(dbInstance, 'smart_ledger', 'shared_data');
            const docSnap = await getDoc(docRef);

            if (!docSnap.exists()) {
                await setDoc(docRef, {
                    appData: appData,
                    monthlyDataMap: monthlyDataMap,
                    updatedAt: new Date().toISOString()
                });
            }

            if (unsubscribeSnapshot) unsubscribeSnapshot();
            unsubscribeSnapshot = onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    if (data.appData) appData = data.appData;
                    if (data.monthlyDataMap) monthlyDataMap = data.monthlyDataMap;
                    saveToLocalStorage();
                    refreshAllUI();
                }
            });

            isFirebaseConnected = true;
            updateFirebaseUIStatus(true, "온라인 (Firestore)");
            localStorage.setItem(STORAGE_KEY_FIREBASE_CONFIG, JSON.stringify(configObj));
        } catch (err) {
            updateFirebaseUIStatus(false, "연동 실패");
        }
    }

    function updateFirebaseUIStatus(isConnected, text) {
        const statusBadge = document.getElementById('firebase-status-badge');
        const settingStatus = document.getElementById('firebase-setting-status');
        if (isConnected) {
            if (statusBadge) {
                statusBadge.className = "text-[9px] sm:text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1 bg-emerald-500/20 text-emerald-300 border border-emerald-400/30";
                statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> ${text}`;
            }
            if (settingStatus) {
                settingStatus.className = "text-xs font-extrabold px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300";
                settingStatus.innerText = "Firebase 실시간 연동 중";
            }
        } else {
            if (statusBadge) {
                statusBadge.className = "text-[9px] sm:text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1 bg-amber-500/20 text-amber-300 border border-amber-400/30";
                statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> ${text}`;
            }
            if (settingStatus) {
                settingStatus.className = "text-xs font-extrabold px-3 py-1 rounded-full bg-slate-100 text-slate-700 border border-slate-300";
                settingStatus.innerText = "오프라인 (Local Storage)";
            }
        }
    }

    function saveAndConnectFirebase() {
        const raw = document.getElementById('firebase-config-json').value.trim();
        if (!raw) return alert("Firebase Config JSON을 입력해주세요.");
        try { connectFirebaseWithConfig(JSON.parse(raw)); } catch (e) { alert("JSON 형식이 올바르지 않습니다."); }
    }

    function disconnectFirebase() {
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        isFirebaseConnected = false;
        dbInstance = null;
        localStorage.removeItem(STORAGE_KEY_FIREBASE_CONFIG);
        updateFirebaseUIStatus(false, "오프라인 (Local)");
        alert("Firebase 연동이 해제되었습니다.");
    }

            localStorage.clear();
            appData = JSON.parse(JSON.stringify(defaultAppData));

            saveDataSync();
            location.reload();
        }
    }

        if (activeTab) activeTab.classList.remove('hidden');

    function loadMonthlyData() {
        const inputMonth = document.getElementById('selected-month').value;
        if (inputMonth) {
            currentMonth = inputMonth;
            const [yr, mo] = inputMonth.split('-').map(Number);
            calendarDate = new Date(yr, mo - 1, 1);
            
            const shortDateText = formatDateShort(currentMonth);
            document.getElementById('monthly-badge-text').innerText = `[${shortDateText} 기록 작성/조회 중]`;
            document.getElementById('invest-badge-text').innerText = `[${shortDateText} 기록 작성/조회 중]`;
            document.getElementById('review-badge-text').innerText = `[${shortDateText} 기록 작성/조회 중]`;

            document.getElementById('save-btn-month-label').innerText = `[월별 가계부] ${shortDateText} 기록 동기화/저장`;
            document.getElementById('save-btn-invest-label').innerText = `[저축/투자] ${shortDateText} 기록 동기화/저장`;
            document.getElementById('save-btn-review-label').innerText = `[월간 리뷰] ${shortDateText} 기록 동기화/저장`;

            if (!monthlyDataMap[currentMonth]) {
                monthlyDataMap[currentMonth] = {
                    salary: 0, bonus: 0,
                    accounts: JSON.parse(JSON.stringify(appData.accounts)),
                    expenses: []
                };
            }

            appData.accounts = monthlyDataMap[currentMonth].accounts || appData.accounts;
            appData.expenses = monthlyDataMap[currentMonth].expenses || [];

            document.getElementById('input-salary').value = monthlyDataMap[currentMonth].salary || '';
            document.getElementById('input-bonus').value = monthlyDataMap[currentMonth].bonus || '';

            const prevDate = new Date(yr, mo - 2, 1);
            const prevShortText = formatDateShort(`${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`);
            document.getElementById('btn-save-prev-asset-label').innerText = `${prevShortText} 자산으로 확정/기록`;

            renderAccountBalances();
            renderVariableExpenses();
            calculateMonthlySummary();
            renderCalendar();
            renderAccountSelects();
            renderSchedules();
        }
    }

    function calculateMonthlySummary() {
        const sal = parseFloat(document.getElementById('input-salary').value) || 0;
        const bon = parseFloat(document.getElementById('input-bonus').value) || 0;
        if (monthlyDataMap[currentMonth]) {
            monthlyDataMap[currentMonth].salary = sal;
            monthlyDataMap[currentMonth].bonus = bon;
        }
        const totalIn = sal + bon;

        const filteredSchedules = appData.schedules.filter(s => {
            if (currentMode === 'euna') return s.owner === 'euna' || s.owner === 'common';
            if (currentMode === 'taejun') return s.owner === 'taejun';
            return true;
        });
        const fixed = filteredSchedules.reduce((sum, s) => sum + s.amount, 0);

        const filteredExpenses = appData.expenses.filter(e => {
            if (currentMode === 'euna') return e.owner === 'euna' || e.owner === 'common';
            if (currentMode === 'taejun') return e.owner === 'taejun';
            return true;
        });
        const variable = filteredExpenses.reduce((sum, e) => sum + e.amount, 0);

        const filteredRules = appData.splitRules.filter(r => {
            const acc = appData.accounts.find(a => a.id === r.accountId);
            const owner = acc ? acc.owner : 'common';
            if (currentMode === 'euna') return owner === 'euna' || owner === 'common';
            if (currentMode === 'taejun') return owner === 'taejun';
            return true;
        });
        const totalSplitAllocated = filteredRules.reduce((sum, r) => sum + r.amount, 0);

        const emergencyBalance = totalIn - totalSplitAllocated;

        document.getElementById('sum-total-income').innerText = `${totalIn.toLocaleString()} 원`;
        document.getElementById('sum-income-sub').innerText = `월급 ${sal.toLocaleString()} | 부수입 ${bon.toLocaleString()}`;
        document.getElementById('sum-fixed-expenses').innerText = `${fixed.toLocaleString()} 원`;
        document.getElementById('sum-variable-expenses').innerText = `${variable.toLocaleString()} 원`;
        document.getElementById('sum-net-income').innerText = `${emergencyBalance.toLocaleString()} 원`;

        const splitContainer = document.getElementById('account-split-container');
        if (splitContainer) {
            let html = filteredRules.map(rule => {
                const acc = appData.accounts.find(a => a.id === rule.accountId);
                const bankName = acc ? acc.bank : '통장';
                const nameDisplay = rule.displayName || (acc ? acc.name : '통장 배분');
                const purposeText = rule.purpose ? ` · 표기 목적: ${rule.purpose}` : '';
                const ownerBadge = getAccountOwnerBadge(acc ? acc.owner : 'common');

                return `
                    <div class="bg-slate-50/80 p-3 rounded-xl border border-slate-200/60 flex justify-between items-center text-xs">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-800">[${bankName}] ${nameDisplay}</span>
                                ${ownerBadge}
                            </div>
                            <span class="text-[10px] text-slate-400">자동 배분${purposeText}</span>
                        </div>

    function saveCurrentBalancesToAssets() {
        const eunaFin = appData.accounts.filter(a => a.owner === 'euna' && a.isFinance).reduce((s, a) => s + (a.balance || 0), 0);
        const taejunFin = appData.accounts.filter(a => a.owner === 'taejun' && a.isFinance).reduce((s, a) => s + (a.balance || 0), 0);
        const commonFin = appData.accounts.filter(a => a.owner === 'common' && a.isFinance).reduce((s, a) => s + (a.balance || 0), 0);

        const [yr, mo] = currentMonth.split('-').map(Number);
        const prevDate = new Date(yr, mo - 2, 1);
        const targetPrevMonth = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;

        let hist = appData.assetHistory.find(h => h.month === targetPrevMonth);
        if (hist) {
            hist.eunaFin = eunaFin;
            hist.taejunFin = taejunFin;
            hist.commonFin = commonFin;
        } else {
            appData.assetHistory.push({ month: targetPrevMonth, eunaFin, taejunFin, commonFin, re: kbRealEstatePrice, debt: 412000000 });
            appData.assetHistory.sort((a, b) => a.month.localeCompare(b.month));
        }
        saveDataSync();
        renderAssetChartsAndTables();
        alert(`${formatDateShort(targetPrevMonth)} 자산 히스토리에 통장 잔액이 보관되었습니다.`);
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const label = document.getElementById('calendar-month-label');
        if (!grid) return;
        const year = calendarDate.getFullYear();
        const month = calendarDate.getMonth();
        if (label) label.innerText = formatDateShort(`${year}-${String(month + 1).padStart(2, '0')}`);

        const firstDay = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        let html = ['일', '월', '화', '수', '목', '금', '토'].map(d => `<div class="font-bold text-slate-400 py-1">${d}</div>`).join('');

        for (let i = 0; i < firstDay; i++) html += `<div></div>`;
        for (let d = 1; d <= totalDays; d++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const dayExp = appData.expenses.filter(e => e.date === dateStr).reduce((s, e) => s + e.amount, 0);
            const hasSchedule = appData.schedules.some(s => s.day === d);

            html += `
                <div class="border border-slate-100 rounded-lg p-0.5 flex flex-col justify-between items-center min-h-[30px] ${dayExp > 0 ? 'bg-amber-50/50' : ''}">
                    <span class="font-semibold text-slate-600 text-[10px]">${d}</span>
                    <div class="flex items-center gap-0.5">
                        ${hasSchedule ? '<span class="w-1.5 h-1.5 rounded-full bg-indigo-600 inline-block"></span>' : ''}
                        ${dayExp > 0 ? '<span class="w-1.5 h-1.5 rounded-full bg-rose-500 inline-block"></span>' : ''}
                    </div>
                </div>
            `;
        }
        grid.innerHTML = html;
    }

    function renderReviewDashboard() {
        const monthInput = document.getElementById('review-selected-month');
        const availableMonths = Object.keys(monthlyDataMap).sort();
        if (!reviewSelectedMonth || !monthlyDataMap[reviewSelectedMonth]) {
            reviewSelectedMonth = monthlyDataMap[currentMonth]
                ? currentMonth
                : (availableMonths[availableMonths.length - 1] || currentMonth);
        }
        if (monthInput) monthInput.value = reviewSelectedMonth;

        if (!Array.isArray(reviewCompareMonths) || reviewCompareMonths.length === 0) {
            reviewCompareMonths = availableMonths.length > 0 ? [...availableMonths] : [reviewSelectedMonth];
        }

        const targetMonth = reviewSelectedMonth;
        const mData = monthlyDataMap[targetMonth] || { salary: 0, bonus: 0, expenses: [] };
        const totalIn = (mData.salary || 0) + (mData.bonus || 0);

        const filteredSchedules = appData.schedules.filter(s => {
            if (currentMode === 'euna') return s.owner === 'euna' || s.owner === 'common';
            if (currentMode === 'taejun') return s.owner === 'taejun';
            return true;
        });
        const fixed = filteredSchedules.reduce((sum, s) => sum + s.amount, 0);

        const monthExpenses = mData.expenses || [];
        const filteredExpenses = monthExpenses.filter(e => {
            if (currentMode === 'euna') return e.owner === 'euna' || e.owner === 'common';
            if (currentMode === 'taejun') return e.owner === 'taejun';
            return true;
        });
        const variable = filteredExpenses.reduce((sum, e) => sum + e.amount, 0);
        const totalExp = fixed + variable;

        const savingsRate = totalIn > 0 ? (((totalIn - totalExp) / totalIn) * 100).toFixed(1) : 0;
        const expRate = totalIn > 0 ? ((totalExp / totalIn) * 100).toFixed(1) : 0;

        const sortedHist = [...appData.assetHistory].sort((a, b) => a.month.localeCompare(b.month));
        const curHist = sortedHist.find(h => h.month === targetMonth);
        const prevHist = sortedHist.filter(h => h.month < targetMonth).pop();
        const growthEl = document.getElementById('rev-net-growth');
        if (growthEl) {
            if (curHist && prevHist) {
                const curNet = (curHist.eunaFin + curHist.taejunFin + curHist.commonFin + curHist.re) - curHist.debt;
                const prevNet = (prevHist.eunaFin + prevHist.taejunFin + prevHist.commonFin + prevHist.re) - prevHist.debt;
                const diff = curNet - prevNet;
                growthEl.innerText = `${diff >= 0 ? '+' : ''}${diff.toLocaleString()} 원`;
            } else {
                growthEl.innerText = '0 원';
            }
        }

        document.getElementById('rev-total-income').innerText = `${totalIn.toLocaleString()} 원`;
        document.getElementById('rev-total-expense').innerText = `${totalExp.toLocaleString()} 원`;
        document.getElementById('rev-savings-rate').innerText = `${savingsRate} %`;
        document.getElementById('rev-expense-rate').innerText = `${expRate} %`;

        renderReviewActiveChips();
        renderReviewComparisonChart();
    }

    function deleteConfirmedMonthRecord() {
        const targetMonth = document.getElementById('review-selected-month')?.value || reviewSelectedMonth;
        if (!targetMonth) return;

        const hasMonthly = Boolean(monthlyDataMap[targetMonth]);
        const hasAssetHist = appData.assetHistory.some(h => h.month === targetMonth);

        if (!hasMonthly && !hasAssetHist) {
            alert(`${formatDateShort(targetMonth)}에 삭제할 확정 기록이 없습니다.`);
            return;
        }

        if (!confirm(`${formatDateShort(targetMonth)}의 확정 기록(월간 리뷰/자산 확정 내역)을 삭제하시겠습니까?`)) {
            return;
        }

        if (hasMonthly) {
            delete monthlyDataMap[targetMonth];
        }
        if (hasAssetHist) {
            appData.assetHistory = appData.assetHistory.filter(h => h.month !== targetMonth);
        }
        reviewCompareMonths = reviewCompareMonths.filter(m => m !== targetMonth);

        if (currentMonth === targetMonth) {
            loadMonthlyData();
        }
        saveDataSync();
        renderAssetChartsAndTables();
        renderReviewDashboard();
        alert(`${formatDateShort(targetMonth)} 확정 기록이 삭제되었습니다.`);
    }

    function renderReviewComparisonChart() {
        const ctx = document.getElementById('review-comparison-chart');
        if (!ctx) return;
        if (reviewComparisonChart) reviewComparisonChart.destroy();

        const selectedMonths = reviewCompareMonths.length > 0 ? reviewCompareMonths : [reviewSelectedMonth];

        const categories = reviewExpType === 'variable' ? (appData.categories || []) : (appData.fixedCategories || []);
        const datasets = selectedMonths.map((m, idx) => {
            const colors = ['#a7f3d0', '#fde047', '#fed7aa', '#fbcfe8', '#c7d2fe'];
            let data = categories.map(cat => {
                if (reviewExpType === 'variable') {
                    const mData = monthlyDataMap[m];
                    if (!mData) return 0;
                    return (mData.expenses || []).filter(e => e.category === cat).reduce((s, e) => s + e.amount, 0);
                } else {
                    return appData.schedules.filter(s => s.category === cat).reduce((s, sc) => s + sc.amount, 0);
                }
            });
            return {
                label: formatDateShort(m),
                data: data,
                backgroundColor: colors[idx % colors.length],
                borderRadius: 4
            };
        });

        reviewComparisonChart = new Chart(ctx.getContext('2d'), {
            type: 'bar',
            data: { labels: categories, datasets: datasets },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } } }
        });
    }

        if (confirm(`${formatDateShort(month)} 자산 기록을 삭제하시겠습니까?`)) {
            appData.assetHistory = appData.assetHistory.filter(h => h.month !== month);
            saveDataSync();
            renderAssetChartsAndTables();
        }
    }

    function exportJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
        const dl = document.createElement('a');
        dl.setAttribute("href", dataStr);
        dl.setAttribute("download", `smart_ledger_backup_${currentMonth}.json`);
        document.body.appendChild(dl);
        dl.click();
        dl.remove();
    }

    function importJSON(event) {
        const fr = new FileReader();
        fr.onload = function(e) {
            try {
                appData = JSON.parse(e.target.result);
                saveDataSync();
                refreshAllUI();
                alert('데이터 복원 및 동기화가 완료되었습니다.');
            } catch (err) {
                alert('올바르지 않은 JSON 파일 형식입니다.');
            }
        };
        fr.readAsText(event.target.files[0]);
    }

    function saveCurrentMonthData() {
        saveDataSync();
        alert(`${formatDateShort(currentMonth)} 가계부 데이터가 저장 및 실시간 동기화되었습니다.`);
    }

    window.onload = function() {
        loadFromLocalStorage();

        const configTextarea = document.getElementById('firebase-config-json');
        if (configTextarea) configTextarea.value = JSON.stringify(DEFAULT_FIREBASE_CONFIG, null, 2);

        const savedConfig = localStorage.getItem(STORAGE_KEY_FIREBASE_CONFIG);
        let activeConfig = DEFAULT_FIREBASE_CONFIG;
        if (savedConfig) {
            try {
                activeConfig = JSON.parse(savedConfig);
                if (configTextarea) configTextarea.value = JSON.stringify(activeConfig, null, 2);
            } catch (e) {}
        }

        connectFirebaseWithConfig(activeConfig);

        const today = new Date();
        const yr = today.getFullYear();
        const mo = String(today.getMonth() + 1).padStart(2, '0');
        document.getElementById('selected-month').value = `${yr}-${mo}`;
        reviewSelectedMonth = `${yr}-${mo}`;
        loadMonthlyData();
        updateScheduleAccountSelect();
        renderSplitRules();
        renderCategoryManagers();
    };
</script>
